<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional BMI Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bmi-card">
        <h2>[ BMI_INDEX ]</h2>

        <div class="input-group">
            <label>WEIGHT (KG)</label>
            <input type="number" id="weight" placeholder="e.g. 70">
        </div>

        <div class="input-group">
            <label>HEIGHT UNIT</label>
            <select id="height-unit">
                <option value="cm">CENTIMETERS (CM)</option>
                <option value="ft">FEET (FT)</option>
            </select>
        </div>

        <div class="input-group">
            <label class="heLab">HEIGHT (CM)</label>
            <input type="number" id="height" placeholder="e.g. 175">
        </div>

        <button class="calc-btn">Analyze Data</button>

        <div class="result-box">
            <span id="bmi-value">0.0</span>
            <span id="bmi-status">Waiting for input...</span>
            <span id="bmi-discrive">---</span>
        </div>
    </div>
<script src="script.js"></script>
</body>

</html>
