<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Market - Product Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>[ CYBER_STORE ]</h1>
            <p>Find your next high-tech gear instantly</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Type to search products...">
                
                <button id="clear-search-btn" class="clear-btn">&times;</button>
                
                <div id="history-box" class="history-hidden"></div>
            </div>
        </div>

        <div id="product-grid"></div>
    </div>

    <div id="product-detail-modal" class="modal-hidden">
        <div class="modal-content">
            <span class="close-modal-btn">&times;</span>
            
            <div class="modal-body">
                <div class="modal-img-container">
                    <img id="modal-product-image" src="" alt="Product Image">
                </div>
                <div class="modal-info">
                    <span id="modal-product-category" class="product-category"></span>
                    <h2 id="modal-product-name"></h2>
                    <div id="modal-product-price" class="product-price"></div>
                    <p class="product-desc">This is a premium cyber-grade product designed for the ultimate tech experience. Made with futuristic materials and certified for high-end performance.</p>
                    <button class="buy-btn" style="width: 100%; margin-top: 20px;">Add To Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
