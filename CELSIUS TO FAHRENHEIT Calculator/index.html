<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Tech Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="inner-div">
            <h2>SYSTEM_CORE: CONV</h2>
            <input type="number" id="val" placeholder="ENTER_CELSIUS">

            <div class="button-box">
                <button class="button">Execute</button>
            </div>
            <select id="mode">
                <option value="c-to-f">CELSIUS TO FAHRENHEIT</option>
                <option value="f-to-c">FAHRENHEIT TO CELSIUS</option>
            </select>
            <div class="show-answer" id="result">---</div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
